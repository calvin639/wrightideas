AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Memories in Stone - Backend API
  Handles orders, payments, file uploads, AI video generation, and montage building.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Deployment environment

  FrontendUrl:
    Type: String
    Default: https://memories.wrightideas.biz
    Description: Frontend URL for CORS and redirects

  SesFromEmail:
    Type: String
    Default: noreply@wrightideas.biz
    Description: Verified SES sender email (domain must be verified in SES)

  StripeSecretKey:
    Type: String
    NoEcho: true
    Description: Stripe secret key (sk_test_... or sk_live_...)

  RunwayApiKey:
    Type: String
    NoEcho: true
    Default: "placeholder-runway-deprecated"
    Description: >
      DEPRECATED — Runway is no longer the video provider. Its API route to
      seedance blocks photographs of real people
      (INPUT_PREPROCESSING.SAFETY.THIRD_PARTY) and its first-party models
      reject the first/last keyframe array, so it can give us faces or identity
      pinning but never both. Retained so the stack and the RunwayWebhook route
      still deploy; nothing reads it. Video generation uses FalApiKey.

  StripeWebhookSecret:
    Type: String
    NoEcho: true
    Default: whsec_placeholder_update_after_first_deploy
    Description: Stripe webhook signing secret

  RunwayWebhookUrl:
    Type: String
    Default: https://placeholder/webhooks/runway
    Description: >
      DEPRECATED — callbacks for a provider we no longer use. The endpoint was
      already observe-only (Step Functions polls instead); it is now inert.

  FalApiKey:
    Type: String
    NoEcho: true
    Description: >
      fal.ai API key — the video generation provider. Runway's API route to
      seedance blocks photographs of real people
      (INPUT_PREPROCESSING.SAFETY.THIRD_PARTY) and its own models reject the
      first/last keyframe array, so fal is the only route giving us both faces
      and identity pinning.

  VideoModel:
    Type: String
    Default: bytedance/seedance-2.0/image-to-video
    Description: >
      fal model slug for image-to-video. seedance is the default because it is
      the only tested model that both accepts an end keyframe AND still moves
      when the end frame is identical to the start. Kling (v3 Pro and O3 Pro)
      accepts the end frame and freezes; fal-ai/vidu/q3/image-to-video works
      and is the fallback. Changing this to a model outside KEYFRAME_MODELS
      (see video_generator) silently drops identity pinning.

  RunwayModel:
    Type: String
    Default: seedance2
    Description: >
      DEPRECATED — see VideoModel, which is the live setting. Historical note:
      Runway ML model for image-to-video generation. seedance2 is the default
      because it is the model documented to accept promptImage as a first/last
      keyframe array, which is what pins subject identity across the clip.
      Changing this to a model outside KEYFRAME_MODELS (see video_generator)
      silently loses that guarantee.

  RestoreWeight:
    Type: String
    Default: "0.5"
    Description: >
      How far GFPGAN's reconstruction is blended back toward the real face
      (0-1). Higher reconstructs more and risks altering a face the customer
      knows intimately. Lower is more faithful but softer.

  SharpnessSoft:
    Type: String
    Default: "250"
    Description: >
      Sharpness (variance-of-Laplacian) below which an image is handed to face
      restoration. Raise to restore more photos, lower to restore fewer.

  RestoreWeightMin:
    Type: String
    Default: "0.15"
    Description: >
      Floor for the face-size-adaptive restore weight. Small faces (group
      shots) are blended at this weight; large portrait faces at RestoreWeight;
      linear in between. See image_restore._adaptive_weight.

  ReviewMode:
    Type: String
    Default: "gate"
    AllowedValues: ["off", "notify", "gate"]
    Description: >
      Human-in-the-loop review of prepared frames before Runway spend.
      "gate" emails the admin and BLOCKS the pipeline until approved (or the
      review window times out and auto-approves). "notify" sends the same
      email but does not wait. "off" skips review entirely.

  EnableAlerts:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      Create the SNS alert topic and CloudWatch alarms. Off by default because
      the deploying IAM user needs SNS and CloudWatch permissions it may not
      have — without them CloudFormation fails the whole stack and rolls back,
      taking every unrelated change with it. Turn on once the deploy role has
      the SNS/CloudWatch actions listed in RUNBOOK.md. With this off the
      pipeline still runs and still emails the admin from NotifyFailure; what
      is lost is the backstop for failures that never reach that state.

  AdminEmail:
    Type: String
    Default: "calvin@wrightideas.biz"
    Description: >
      Recipient of review-gate and new-order admin emails. Must be an address
      SES in this account can actually deliver to: while SES is in sandbox,
      that means a verified identity — wrightideas.biz is the verified domain,
      so an address on it works and an external mailbox silently would not.

# NOTE: Runtime, Architectures and Layers are deliberately NOT set here.
# ImagePrepFunction is a container image, and Lambda rejects all three for
# PackageType: Image. Globals cannot be unset per-resource, so each zip function
# declares them individually — see the ZipFunctionDefaults comment below.
Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        ORDERS_TABLE: !Ref OrdersTable
        UPLOADS_BUCKET: !Ref UploadsBucket
        VIDEOS_BUCKET: !Ref VideosBucket
        FRONTEND_URL: !Ref FrontendUrl
        VIDEOS_CF_URL: !Sub 'https://${VideosCloudFrontDistribution.DomainName}'
        SES_FROM_EMAIL: !Ref SesFromEmail
        # Global, not per-function: more than one function emails the admin
        # (stripe_webhook on a new order, review_notify on a prep review). Set
        # on only one of them, the others silently fall back to the hardcoded
        # default in email_utils — which is how a stale address survives.
        ADMIN_EMAIL: !Ref AdminEmail
        # Secrets passed as NoEcho parameters at deploy time — encrypted at rest by Lambda KMS
        STRIPE_SECRET_KEY: !Ref StripeSecretKey
        RUNWAY_API_KEY: !Ref RunwayApiKey
        STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret
        RUNWAY_WEBHOOK_URL: !Ref RunwayWebhookUrl
        FAL_KEY: !Ref FalApiKey
        FAL_MODEL: !Ref VideoModel
        RUNWAY_MODEL: !Ref RunwayModel
        MUSIC_KEY_PREFIX: music/
  Api:
    Cors:
      AllowOrigin: !Sub "'${FrontendUrl}'"
      AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Requested-With'"
      AllowMethods: "'GET,POST,OPTIONS'"

# ─── RESOURCES ────────────────────────────────────────────────────────────────

Conditions:
  CreateAlerts: !Equals [!Ref EnableAlerts, 'true']

Resources:

  # ── API GATEWAY ──────────────────────────────────────────────────────────────

  MemoriesApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendUrl
          - http://localhost:3000
          - https://calvin639.github.io
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Requested-With
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        MaxAge: 86400

  # ── LAMBDA LAYER (shared dependencies) ───────────────────────────────────────

  DependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub 'memories-dependencies-${Environment}'
      Description: Shared Python dependencies for Memories in Stone
      ContentUri: layers/dependencies/
      CompatibleRuntimes:
        - python3.12
      CompatibleArchitectures:
        - x86_64
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: makefile

  # ── DYNAMODB TABLE ────────────────────────────────────────────────────────────

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'memories-orders-${Environment}'
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: MemoriesInStone
        - Key: Environment
          Value: !Ref Environment

  # ── SES DOMAIN IDENTITY ───────────────────────────────────────────────────────

  SesEmailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: wrightideas.biz
      DkimAttributes:
        SigningEnabled: true

  # ── S3 BUCKETS ────────────────────────────────────────────────────────────────

  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'memories-uploads-${Environment}-${AWS::AccountId}'
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref FrontendUrl
              - http://localhost:3000
              - https://calvin639.github.io
            AllowedMethods: [GET, PUT, POST]
            AllowedHeaders: ['*']
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: DeleteRawUploadsAfter30Days
            Status: Enabled
            ExpirationInDays: 30
            Prefix: uploads/
      Tags:
        - Key: Project
          Value: MemoriesInStone

  VideosBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'memories-videos-${Environment}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: MemoriesInStone

  VideosBucketPolicy:
    Type: AWS::S3::BucketPolicy
    # No DependsOn needed — the !Sub on the distribution ID in the condition
    # below already establishes the ordering.
    Properties:
      Bucket: !Ref VideosBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub 'arn:aws:s3:::${VideosBucket}/*'
            Condition:
              ArnLike:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${VideosCloudFrontDistribution}'

  # ── CLOUDFRONT (Videos) ───────────────────────────────────────────────────────

  VideosOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'memories-videos-oac-${Environment}'
        Description: OAC for Memories in Stone videos bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  VideosCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub 'Memories in Stone — Videos CDN (${Environment})'
        Enabled: true
        HttpVersion: http2
        PriceClass: PriceClass_100
        DefaultCacheBehavior:
          TargetOriginId: VideosBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized (AWS managed)
          OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf  # CORS-S3Origin (AWS managed)
        Origins:
          - Id: VideosBucketOrigin
            DomainName: !GetAtt VideosBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt VideosOAC.Id
      Tags:
        - Key: Project
          Value: MemoriesInStone
        - Key: Environment
          Value: !Ref Environment

  # ── SQS QUEUES ────────────────────────────────────────────────────────────────

  # The VideoGeneration and Montage SQS queues were removed when the pipeline
  # moved to Step Functions. The Map state IS the fan-out and the join, so the
  # queues, the manual "are all files done?" scans, and the race between the
  # Runway webhook and the EventBridge poller all went with them.

  # ── SHARED IAM ROLE ───────────────────────────────────────────────────────────

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'memories-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: MemoriesLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt OrdersTable.Arn
                  - !Sub '${OrdersTable.Arn}/index/*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:GeneratePresignedUrl
                Resource:
                  - !Sub '${UploadsBucket.Arn}/*'
                  - !Sub '${VideosBucket.Arn}/*'
              # The Stripe webhook starts the pipeline execution. Scoped to this
              # one state machine rather than '*'.
              #
              # The ARN is constructed rather than !Ref'd on purpose: the state
              # machine's role grants InvokeFunction on the Lambdas that use
              # this role, so referencing it here would close a dependency loop
              # (function -> role -> state machine -> function). The name is
              # fixed by the Name property on MemoriesPipeline.
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource: !Sub 'arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:memories-pipeline-${Environment}'
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: '*'
              # The review gate: review_notify auto-approves in off/notify
              # modes and review_decision redeems the admin's approval. Task
              # tokens are not resource-scopable, hence '*'.
              - Effect: Allow
                Action:
                  - states:SendTaskSuccess
                  - states:SendTaskFailure
                Resource: '*'
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  # Cross-region inference profile + foundation models across all EU routing regions
                  - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/eu.anthropic.claude-haiku-*'
                  - 'arn:aws:bedrock:eu-*::foundation-model/anthropic.claude-haiku-*'
              - Effect: Allow
                Action:
                  - aws-marketplace:ViewSubscriptions
                  - aws-marketplace:Subscribe
                Resource: '*'
              # Secrets are injected as Lambda env vars at deploy time — no Secrets Manager needed at runtime

  # ── API FUNCTIONS ─────────────────────────────────────────────────────────────

  CreateOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'memories-create-order-${Environment}'
      CodeUri: src/
      Runtime: python3.12
      Architectures: [x86_64]
      Layers:
        - !Ref DependenciesLayer
      Handler: functions.create_order.handler.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Description: Create a new memorial stone order and generate S3 presigned upload URLs
      Events:
        CreateOrder:
          Type: HttpApi
          Properties:
            ApiId: !Ref MemoriesApi
            Path: /orders
            Method: POST

  GetOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'memories-get-order-${Environment}'
      CodeUri: src/
      Runtime: python3.12
      Architectures: [x86_64]
      Layers:
        - !Ref DependenciesLayer
      Handler: functions.get_order.handler.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Description: Get order status and details
      Events:
        GetOrder:
          Type: HttpApi
          Properties:
            ApiId: !Ref MemoriesApi
            Path: /orders/{order_id}
            Method: GET

  CreateCheckoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'memories-create-checkout-${Environment}'
      CodeUri: src/
      Runtime: python3.12
      Architectures: [x86_64]
      Layers:
        - !Ref DependenciesLayer
      Handler: functions.create_checkout.handler.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Description: Create a Stripe Checkout session for an order
      Events:
        CreateCheckout:
          Type: HttpApi
          Properties:
            ApiId: !Ref MemoriesApi
            Path: /orders/{order_id}/checkout
            Method: POST

  StripeWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'memories-stripe-webhook-${Environment}'
      CodeUri: src/
      Runtime: python3.12
      Architectures: [x86_64]
      Layers:
        - !Ref DependenciesLayer
      Handler: functions.stripe_webhook.handler.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Description: Handle Stripe payment webhooks and start the pipeline
      Environment:
        Variables:
          # Constructed, not !Ref'd — see the IAM policy comment above.
          STATE_MACHINE_ARN: !Sub 'arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:memories-pipeline-${Environment}'
      Events:
        StripeWebhook:
          Type: HttpApi
          Properties:
            ApiId: !Ref MemoriesApi
            Path: /webhooks/stripe
            Method: POST

  RunwayWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'memories-runway-webhook-${Environment}'
      CodeUri: src/
      Runtime: python3.12
      Architectures: [x86_64]
      Layers:
        - !Ref DependenciesLayer
      Handler: functions.runway_webhook.handler.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Description: Handle Runway ML task completion webhooks
      Events:
        RunwayWebhook:
          Type: HttpApi
          Properties:
            ApiId: !Ref MemoriesApi
            Path: /webhooks/runway
            Method: POST

  # ── PROCESSING FUNCTIONS ──────────────────────────────────────────────────────

  # The only container-image function in the stack. It carries torch, so that
  # Real-ESRGAN and GFPGAN can restore degraded photos before Runway sees them —
  # roughly 3GB installed, far past the 250MB layer limit.
  #
  # arm64 (Graviton2): ~20% cheaper, and it builds natively on Apple Silicon
  # instead of through QEMU emulation. It uses no Lambda layer — its
  # dependencies are baked into the image.
  ImagePrepFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'memories-image-prep-${Environment}'
      PackageType: Image
      Architectures: [arm64]
      Role: !GetAtt LambdaExecutionRole.Arn
      Description: Orient, crop, enhance and restore one uploaded photo before Runway
      # 10240MB: restoration peaks around 3.9GB (see MIN_RESTORE_MEMORY_MB in
      # image_restore.py for the measurements — the RetinaFace spike is fixed
      # and does not shrink with input size), and this size also provides
      # ~6 vCPU rather than ~2, which cuts restore time roughly threefold.
      #
      # The account's Lambda memory cap was raised from the new-account
      # 3008MB ceiling by an AWS Support case (NOT Service Quotas — function
      # memory is not a self-service quota; L-B99A9384 is concurrency).
      # If this ever deploys into an account still capped at 3008,
      # CloudFormation rejects the value; drop it to 3008 and the memory
      # guard in image_restore.py degrades to deterministic-only processing.
      Timeout: 900
      MemorySize: 10240
      EphemeralStorage:
        Size: 2048
      Environment:
        Variables:
          ENABLE_RESTORE: "true"
          RESTORE_WEIGHT: !Ref RestoreWeight
          RESTORE_WEIGHT_MIN: !Ref RestoreWeightMin
          SHARPNESS_SOFT: !Ref SharpnessSoft
          MODEL_DIR: /opt/ml/models
          # Matched to the ~6 vCPU that 10240MB provides. Oversubscribing
          # torch threads past the available cores makes it slower, not
          # faster — if MemorySize changes, change this with it.
          TORCH_THREADS: "6"
          KEEP_SOURCE_COPY: "true"
    Metadata:
      Dockerfile: functions/image_prep/Dockerfile
      DockerContext: ./src
      DockerTag: !Sub 'image-prep-${Environment}'

  VideoGeneratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'memories-video-generator-${Environment}'
      CodeUri: src/
      Runtime: python3.12
      Architectures: [x86_64]
      Layers:
        - !Ref DependenciesLayer
      Handler: functions.video_generator.handler.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Description: Submit one file to Runway and poll it — driven by the state machine
      # Now invoked once per file rather than once per order, so this only ever
      # covers a single Bedrock prompt call plus one Runway request.
      Timeout: 120
      MemorySize: 1024
      Environment:
        Variables:
          # Set to "false" to disable per-image LLM prompts and use a single
          # generic fallback prompt for every file. Useful as a kill switch
          # if Bedrock costs/quality become a problem.
          USE_PER_IMAGE_PROMPTS: "true"
          # Bedrock model for prompt generation. EU cross-region inference profile.
          # Model access must be enabled in all EU regions via the Bedrock console.
          BEDROCK_PROMPT_MODEL: "eu.anthropic.claude-haiku-4-5-20251001-v1:0"
          BEDROCK_REGION: !Ref AWS::Region
          # Send the prepared frame as both first and last keyframe. Set to
          # "false" to fall back to single-frame submission.
          ENABLE_KEYFRAMES: "true"
          CLIP_DURATION: "5"
      # No Events — invoked directly by the state machine.

  # Sends the admin the before/after review email and (in gate mode) leaves the
  # state machine waiting on its task token. See functions/review_notify.
  ReviewNotifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'memories-review-notify-${Environment}'
      CodeUri: src/
      Runtime: python3.12
      Architectures: [x86_64]
      Layers:
        - !Ref DependenciesLayer
      Handler: functions.review_notify.handler.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Description: Email the admin a prep review and gate the pipeline on approval
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          REVIEW_MODE: !Ref ReviewMode
          # ADMIN_EMAIL comes from Globals — deliberately not repeated here.
          REVIEW_API_BASE: !Sub 'https://${MemoriesApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
      # No Events — invoked by the state machine with waitForTaskToken.

  # Redeems decisions from the review email links, authorised by the per-order
  # 128-bit review key. GET never mutates — it renders a confirmation page (and
  # serves image redirects); the form's POST performs the change. See the
  # Events comment below and the handler docstring.
  ReviewDecisionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'memories-review-decision-${Environment}'
      CodeUri: src/
      Runtime: python3.12
      Architectures: [x86_64]
      Layers:
        - !Ref DependenciesLayer
      Handler: functions.review_decision.handler.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Description: Apply admin review decisions and release the pipeline
      Timeout: 30
      MemorySize: 256
      Events:
        # ANY: GET renders confirmation pages and serves image redirects;
        # POST performs the state changes. Mail scanners follow GET links,
        # so nothing may mutate on GET.
        ReviewDecide:
          Type: HttpApi
          Properties:
            ApiId: !Ref MemoriesApi
            Path: /review/decide
            Method: ANY

  # Admin-only alert when the pipeline stops. Deliberately does NOT email the
  # customer — most failures are fixable before they would ever notice.
  FailureNotifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'memories-failure-notify-${Environment}'
      CodeUri: src/
      Runtime: python3.12
      Architectures: [x86_64]
      Layers:
        - !Ref DependenciesLayer
      Handler: functions.failure_notify.handler.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Description: Email the admin a diagnosis when an order fails
      Timeout: 60
      MemorySize: 512
      # No Events — invoked by the state machine's Catch.

  MontageBuilderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'memories-montage-builder-${Environment}'
      CodeUri: src/
      Runtime: python3.12
      Architectures: [x86_64]
      Layers:
        - !Ref DependenciesLayer
      Handler: functions.montage_builder.handler.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Description: Stitch generated clips into final memorial video using FFmpeg
      Timeout: 900   # 15 min max
      MemorySize: 3008
      EphemeralStorage:
        Size: 5120   # 5GB /tmp for video processing
      # DependenciesLayer is inherited from Globals — do NOT add it here again or Lambda will reject it.
      # Add your FFmpeg layer ARN here after deployment:
      # Layers:
      #   - arn:aws:lambda:eu-west-1:ACCOUNT_ID:layer:ffmpeg:1
      # See README for instructions on building the FFmpeg layer
      # No Events — invoked directly by the state machine as the final step.

  # RunwayPollerFunction was removed. Its job — catching Runway tasks whose
  # webhook never arrived — is now done by the Wait/Poll loop inside the state
  # machine, which polls only the tasks belonging to a live execution rather
  # than scanning every PROCESSING order every five minutes.

  # ── STATE MACHINE ─────────────────────────────────────────────────────────────

  StateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'memories-pipeline-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokePipelineFunctions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt ImagePrepFunction.Arn
                  - !GetAtt VideoGeneratorFunction.Arn
                  - !GetAtt MontageBuilderFunction.Arn
                  - !GetAtt FailureNotifyFunction.Arn
                  - !GetAtt ReviewNotifyFunction.Arn
        # The pipeline writes the customer-visible status itself, with the SDK
        # integration rather than a Lambda: the states that advance the order
        # are the states that know it advanced, and a Lambda round trip to set
        # one attribute is cost and latency for nothing.
        - PolicyName: WriteOrderStatus
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt OrdersTable.Arn

  # Orchestrates one order end to end.
  #
  # Two Map states do the fan-out. The important property is that a Map state is
  # also the join: it completes when every item completes, which is what the old
  # code was hand-rolling with all_files_complete() scans from two different
  # Lambdas — and getting wrong, because both could fire a montage.
  #
  # ToleratedFailurePercentage expresses the partial-montage rule declaratively:
  # up to 60% of photos may fail and the montage still runs with what survived.
  MemoriesPipeline:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub 'memories-pipeline-${Environment}'
      Role: !GetAtt StateMachineRole.Arn
      Type: STANDARD
      Definition:
        Comment: Prepare photos, review-gate, generate clips, build the montage
        StartAt: MarkPreparing
        # Must exceed the ReviewGate window (43200s = 12h) plus the worst-case
        # generation phase, or a slow approval kills the execution at exactly
        # the wrong time. Generation is now bounded: MaxPolls (40) x 30s = 20
        # minutes per clip, four at a time, so a 40-photo order is ~3.5h worst
        # case. 18h leaves real headroom over 12h + 3.5h.
        TimeoutSeconds: 64800
        States:

          # ── Customer-visible status ──────────────────────────────────────
          # Written at every stage boundary. Without these the tracking page
          # sits on one number from payment to delivery — including the 12-hour
          # review park — and then jumps straight to finished.
          MarkPreparing:
            Type: Task
            Resource: arn:aws:states:::aws-sdk:dynamodb:updateItem
            Parameters:
              TableName: !Ref OrdersTable
              Key:
                PK:
                  S.$: States.Format('ORDER#{}', $.order_id)
                SK:
                  S: METADATA
              UpdateExpression: 'SET #st = :s, GSI1PK = :g, updated_at = :t'
              ExpressionAttributeNames:
                '#st': status
              ExpressionAttributeValues:
                ':s':
                  S: PREPARING
                ':g':
                  S: 'STATUS#PREPARING'
                ':t':
                  S.$: $$.State.EnteredTime
            ResultPath: null
            # A status write must never be able to fail an order.
            Retry:
              - ErrorEquals: [States.ALL]
                IntervalSeconds: 2
                MaxAttempts: 3
                BackoffRate: 2
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: null
                Next: PrepareFiles
            Next: PrepareFiles

          PrepareFiles:
            Type: Map
            ItemsPath: $.files
            # Bounded because each prep invocation takes ~6 vCPUs. Higher
            # concurrency just queues at the account level.
            MaxConcurrency: 4
            ToleratedFailurePercentage: 20
            ItemSelector:
              order_id.$: $.order_id
              file_id.$: $$.Map.Item.Value.file_id
            ItemProcessor:
              ProcessorConfig:
                Mode: INLINE
              StartAt: PrepFile
              States:
                PrepFile:
                  Type: Task
                  Resource: !GetAtt ImagePrepFunction.Arn
                  Retry:
                    - ErrorEquals: [Lambda.TooManyRequestsException, Lambda.ServiceException]
                      IntervalSeconds: 5
                      MaxAttempts: 3
                      BackoffRate: 2
                    # A cold start on a 3GB image can exceed the invoke timeout.
                    - ErrorEquals: [States.Timeout]
                      IntervalSeconds: 10
                      MaxAttempts: 2
                  Catch:
                    - ErrorEquals: [States.ALL]
                      ResultPath: $.error
                      Next: PrepFailed
                  End: true
                PrepFailed:
                  Type: Pass
                  Parameters:
                    file_id.$: $.file_id
                    status: FAILED
                  End: true
            ResultPath: $.prepared
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: $.error
                Next: PrepStageFailed
            Next: MarkAwaitingReview

          MarkAwaitingReview:
            Type: Task
            Resource: arn:aws:states:::aws-sdk:dynamodb:updateItem
            Parameters:
              TableName: !Ref OrdersTable
              Key:
                PK:
                  S.$: States.Format('ORDER#{}', $.order_id)
                SK:
                  S: METADATA
              UpdateExpression: 'SET #st = :s, GSI1PK = :g, updated_at = :t'
              ExpressionAttributeNames:
                '#st': status
              ExpressionAttributeValues:
                ':s':
                  S: AWAITING_REVIEW
                ':g':
                  S: 'STATUS#AWAITING_REVIEW'
                ':t':
                  S.$: $$.State.EnteredTime
            ResultPath: null
            Retry:
              - ErrorEquals: [States.ALL]
                IntervalSeconds: 2
                MaxAttempts: 3
                BackoffRate: 2
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: null
                Next: ReviewGate
            Next: ReviewGate

          # Human-in-the-loop before any Runway spend. The Lambda emails the
          # admin a before/after review; in gate mode the execution parks here
          # on a task token until the admin approves (or the window below
          # expires and the Catch releases it). In off/notify modes the Lambda
          # redeems the token itself and this state is a fast pass-through.
          #
          # ResultPath: null keeps $.prepared flowing to GenerateClips intact.
          # TimeoutSeconds is the review window: 12 hours, leaving slack inside
          # the 24h delivery promise. The machine-level TimeoutSeconds at the
          # top of this definition is sized to cover this window plus
          # generation time — change them together.
          ReviewGate:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke.waitForTaskToken
            Parameters:
              FunctionName: !GetAtt ReviewNotifyFunction.Arn
              Payload:
                order_id.$: $.order_id
                task_token.$: $$.Task.Token
            TimeoutSeconds: 43200
            ResultPath: null
            Retry:
              - ErrorEquals: [Lambda.TooManyRequestsException, Lambda.ServiceException]
                IntervalSeconds: 5
                MaxAttempts: 3
                BackoffRate: 2
            Catch:
              # Review window expired: proceed with the frames as prepared.
              # A missed email must never break the delivery promise.
              - ErrorEquals: [States.Timeout]
                ResultPath: $.review_timeout
                Next: MarkProcessing
              # Any other failure in the notify Lambda also must not block
              # the order — degrade to no-review rather than no-video.
              - ErrorEquals: [States.ALL]
                ResultPath: $.review_error
                Next: MarkProcessing
            Next: MarkProcessing

          MarkProcessing:
            Type: Task
            Resource: arn:aws:states:::aws-sdk:dynamodb:updateItem
            Parameters:
              TableName: !Ref OrdersTable
              Key:
                PK:
                  S.$: States.Format('ORDER#{}', $.order_id)
                SK:
                  S: METADATA
              UpdateExpression: 'SET #st = :s, GSI1PK = :g, updated_at = :t'
              ExpressionAttributeNames:
                '#st': status
              ExpressionAttributeValues:
                ':s':
                  S: PROCESSING
                ':g':
                  S: 'STATUS#PROCESSING'
                ':t':
                  S.$: $$.State.EnteredTime
            ResultPath: null
            Retry:
              - ErrorEquals: [States.ALL]
                IntervalSeconds: 2
                MaxAttempts: 3
                BackoffRate: 2
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: null
                Next: GenerateClips
            Next: GenerateClips

          GenerateClips:
            Type: Map
            ItemsPath: $.prepared
            MaxConcurrency: 4
            ToleratedFailurePercentage: 20
            ItemSelector:
              order_id.$: $.order_id
              file.$: $$.Map.Item.Value
              # Seed for the poll budget below. Without a counter the poll loop
              # is unbounded: one clip stuck in the provider's queue holds a
              # concurrency slot and eats the entire execution budget, and the
              # order dies of machine timeout hours later with nobody told.
              polls: 0
            ItemProcessor:
              ProcessorConfig:
                Mode: INLINE
              StartAt: NeedsGeneration
              States:

                # Videos (SKIPPED) and failed preps bypass Runway entirely.
                NeedsGeneration:
                  Type: Choice
                  Choices:
                    - Variable: $.file.status
                      StringEquals: PREPARED
                      Next: SubmitClip
                  Default: NoGeneration

                NoGeneration:
                  Type: Pass
                  Parameters:
                    file_id.$: $.file.file_id
                    state.$: $.file.status
                  End: true

                SubmitClip:
                  Type: Task
                  Resource: !GetAtt VideoGeneratorFunction.Arn
                  Parameters:
                    action: submit
                    order_id.$: $.order_id
                    file_id.$: $.file.file_id
                  ResultPath: $.submit
                  Retry:
                    - ErrorEquals: [Lambda.TooManyRequestsException, Lambda.ServiceException]
                      IntervalSeconds: 5
                      MaxAttempts: 3
                      BackoffRate: 2
                  Catch:
                    - ErrorEquals: [States.ALL]
                      ResultPath: $.error
                      Next: GenerationFailed
                  Next: SubmitAccepted

                SubmitAccepted:
                  Type: Choice
                  Choices:
                    - Variable: $.submit.state
                      StringEquals: RUNNING
                      Next: WaitForClip
                  Default: GenerationSettled

                # Runway clips take roughly 1-3 minutes. 30s keeps the
                # transition count low while still finishing promptly.
                WaitForClip:
                  Type: Wait
                  Seconds: 30
                  Next: PollClip

                PollClip:
                  Type: Task
                  Resource: !GetAtt VideoGeneratorFunction.Arn
                  Parameters:
                    action: poll
                    order_id.$: $.order_id
                    file_id.$: $.file.file_id
                    task_id.$: $.submit.task_id
                  ResultPath: $.poll
                  Retry:
                    - ErrorEquals: [States.ALL]
                      IntervalSeconds: 15
                      MaxAttempts: 3
                      BackoffRate: 2
                  Catch:
                    - ErrorEquals: [States.ALL]
                      ResultPath: $.error
                      Next: GenerationFailed
                  Next: ClipSettled

                ClipSettled:
                  Type: Choice
                  Choices:
                    - Variable: $.poll.state
                      StringEquals: RUNNING
                      Next: CountPoll
                  Default: GenerationSettled

                CountPoll:
                  Type: Pass
                  Parameters:
                    polls.$: States.MathAdd($.polls, 1)
                  ResultPath: $.polls_wrapper
                  Next: PollBudget

                # 40 polls x 30s = 20 minutes per clip. Generation normally
                # takes one to three. A clip still RUNNING after twenty is not
                # slow, it is stuck, and waiting longer only spends the review
                # window's remaining slack.
                PollBudget:
                  Type: Choice
                  Choices:
                    - Variable: $.polls_wrapper.polls
                      NumericGreaterThanEquals: 40
                      Next: GenerationTimedOut
                  Default: RecountPoll

                RecountPoll:
                  Type: Pass
                  Parameters:
                    order_id.$: $.order_id
                    file.$: $.file
                    submit.$: $.submit
                    polls.$: $.polls_wrapper.polls
                  Next: WaitForClip

                GenerationTimedOut:
                  Type: Pass
                  Parameters:
                    file_id.$: $.file.file_id
                    state: TIMED_OUT
                  End: true

                GenerationSettled:
                  Type: Pass
                  Parameters:
                    file_id.$: $.file.file_id
                    state: SETTLED
                  End: true

                GenerationFailed:
                  Type: Pass
                  Parameters:
                    file_id.$: $.file.file_id
                    state: FAILED
                  End: true
            ResultPath: $.generated
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: $.error
                Next: GenerateStageFailed
            Next: MarkMontage

          MarkMontage:
            Type: Task
            Resource: arn:aws:states:::aws-sdk:dynamodb:updateItem
            Parameters:
              TableName: !Ref OrdersTable
              Key:
                PK:
                  S.$: States.Format('ORDER#{}', $.order_id)
                SK:
                  S: METADATA
              UpdateExpression: 'SET #st = :s, GSI1PK = :g, updated_at = :t'
              ExpressionAttributeNames:
                '#st': status
              ExpressionAttributeValues:
                ':s':
                  S: MONTAGE
                ':g':
                  S: 'STATUS#MONTAGE'
                ':t':
                  S.$: $$.State.EnteredTime
            ResultPath: null
            Retry:
              - ErrorEquals: [States.ALL]
                IntervalSeconds: 2
                MaxAttempts: 3
                BackoffRate: 2
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: null
                Next: BuildMontage
            Next: BuildMontage

          BuildMontage:
            Type: Task
            Resource: !GetAtt MontageBuilderFunction.Arn
            Parameters:
              order_id.$: $.order_id
            Retry:
              - ErrorEquals: [Lambda.TooManyRequestsException, Lambda.ServiceException]
                IntervalSeconds: 10
                MaxAttempts: 2
                BackoffRate: 2
            # Montage is where a failed order surfaces: too few usable clips
            # raises here, as does anything wrong with FFmpeg or delivery.
            # Alert the admin with the cause rather than dying silently.
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: $.error
                Next: MontageStageFailed
            End: true

          # ── Failure routing ───────────────────────────────────────────────
          # Each stage names itself before alerting, so the admin email says
          # where it broke instead of always claiming BuildMontage. Previously
          # only BuildMontage had a Catch at all, so a failure anywhere earlier
          # ended the execution with no alert and the order stuck mid-status.
          PrepStageFailed:
            Type: Pass
            Result: PrepareFiles
            ResultPath: $.stage
            Next: NotifyFailure

          GenerateStageFailed:
            Type: Pass
            Result: GenerateClips
            ResultPath: $.stage
            Next: NotifyFailure

          MontageStageFailed:
            Type: Pass
            Result: BuildMontage
            ResultPath: $.stage
            Next: NotifyFailure

          # Terminal failure path. Emails the admin only — never the customer.
          NotifyFailure:
            Type: Task
            Resource: !GetAtt FailureNotifyFunction.Arn
            Parameters:
              order_id.$: $.order_id
              stage.$: $.stage
              error.$: $.error
            Retry:
              - ErrorEquals: [States.ALL]
                IntervalSeconds: 5
                MaxAttempts: 2
                BackoffRate: 2
            # If even the alert Lambda cannot run, still reach the Fail state:
            # without this the execution ends on a Lambda error and the order
            # never registers as failed anywhere.
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: null
                Next: PipelineFailed
            # Fail the execution after alerting, so /workflows and
            # check_pipeline.sh both show the order as genuinely failed.
            Next: PipelineFailed

          PipelineFailed:
            Type: Fail
            Error: PipelineFailed
            Cause: An order failed; the admin has been alerted. See the failed state above.


  # ── ALERTING ──────────────────────────────────────────────────────────────
  # Before this there was no alarm on anything. A failed or timed-out execution
  # left the order stuck in DynamoDB and the only way to find out was for the
  # customer to ask where their video was.

  PipelineAlertTopic:
    Condition: CreateAlerts
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'memories-pipeline-alerts-${Environment}'
      DisplayName: Memories pipeline alerts

  # SNS email subscriptions must be confirmed by clicking the link AWS sends on
  # first deploy. Until that is done the alarms fire into nothing.
  PipelineAlertSubscription:
    Condition: CreateAlerts
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref PipelineAlertTopic
      Protocol: email
      Endpoint: !Ref AdminEmail

  # An execution that fails has already emailed the admin from NotifyFailure.
  # This is the backstop for the failures that never reach that state.
  PipelineFailedAlarm:
    Condition: CreateAlerts
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'memories-pipeline-failed-${Environment}'
      AlarmDescription: An order's pipeline execution failed.
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref MemoriesPipeline
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref PipelineAlertTopic]

  # The important one. A timeout means the order is stuck mid-flight with no
  # Catch, no email and no terminal status — the exact silent failure the
  # bounded poll loop is meant to prevent. If this ever fires, the bound is
  # wrong or something upstream is much slower than it should be.
  PipelineTimedOutAlarm:
    Condition: CreateAlerts
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'memories-pipeline-timed-out-${Environment}'
      AlarmDescription: An order exceeded the pipeline timeout and was abandoned mid-flight.
      Namespace: AWS/States
      MetricName: ExecutionsTimedOut
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref MemoriesPipeline
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref PipelineAlertTopic]

  # Executions run for hours by design (a 12-hour review window), so a duration
  # alarm has to sit above that or it fires on every healthy order. This is
  # sized at 17h — past any legitimate run, short of the 18h machine timeout,
  # so it warns while there is still time to intervene.
  PipelineDurationAlarm:
    Condition: CreateAlerts
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'memories-pipeline-slow-${Environment}'
      AlarmDescription: An order has been running long enough to be close to timing out.
      Namespace: AWS/States
      MetricName: ExecutionTime
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref MemoriesPipeline
      ExtendedStatistic: p99
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 61200000    # 17h in milliseconds
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref PipelineAlertTopic]

  # Stripe talks to this endpoint and nothing else does. An error here is a
  # payment that may have been taken without an order moving.
  StripeWebhookErrorAlarm:
    Condition: CreateAlerts
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'memories-stripe-webhook-errors-${Environment}'
      AlarmDescription: The Stripe webhook is erroring — payments may not be registering.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref StripeWebhookFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref PipelineAlertTopic]

  MontageBuilderErrorAlarm:
    Condition: CreateAlerts
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'memories-montage-errors-${Environment}'
      AlarmDescription: The montage builder is failing.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref MontageBuilderFunction
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref PipelineAlertTopic]

# ── OUTPUTS ────────────────────────────────────────────────────────────────────

Outputs:
  ApiUrl:
    Description: API Gateway base URL
    Value: !Sub 'https://${MemoriesApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub 'memories-api-url-${Environment}'

  UploadsBucketName:
    Description: S3 bucket for customer uploads
    Value: !Ref UploadsBucket

  VideosBucketName:
    Description: S3 bucket for processed videos
    Value: !Ref VideosBucket

  OrdersTableName:
    Description: DynamoDB table name
    Value: !Ref OrdersTable

  PipelineStateMachineArn:
    Description: Step Functions state machine that runs an order end to end
    Value: !Ref MemoriesPipeline
    Export:
      Name: !Sub 'memories-pipeline-arn-${Environment}'

  VideosCloudfrontUrl:
    Description: CloudFront distribution URL for the videos bucket
    Value: !Sub 'https://${VideosCloudFrontDistribution.DomainName}'
    Export:
      Name: !Sub 'memories-videos-cf-url-${Environment}'

  SesDkimRecord1:
    Description: DKIM CNAME to add to Cloudflare (record 1 of 3)
    Value: !Sub '${SesEmailIdentity.DkimDNSTokenName1}.wrightideas.biz -> ${SesEmailIdentity.DkimDNSTokenValue1}.dkim.amazonses.com'

  SesDkimRecord2:
    Description: DKIM CNAME to add to Cloudflare (record 2 of 3)
    Value: !Sub '${SesEmailIdentity.DkimDNSTokenName2}.wrightideas.biz -> ${SesEmailIdentity.DkimDNSTokenValue2}.dkim.amazonses.com'

  SesDkimRecord3:
    Description: DKIM CNAME to add to Cloudflare (record 3 of 3)
    Value: !Sub '${SesEmailIdentity.DkimDNSTokenName3}.wrightideas.biz -> ${SesEmailIdentity.DkimDNSTokenValue3}.dkim.amazonses.com'
